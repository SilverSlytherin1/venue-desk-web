name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository or publishes anything.
permissions:
  contents: read

# A newer push makes the run before it pointless. Safe to cancel: this workflow does not deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so dependencies are installed once. The steps run cheapest first: a lint error stops
  # the run before the browser tests start.
  check:
    name: Lint, test, build and end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build
      # Starts the dev server and runs Cypress against it. Every API call is stubbed, so no backend.
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
